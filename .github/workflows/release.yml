name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 打包 ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 现在免费的标准 macOS 运行器只有 arm64（macos-15），x64 由 electron-builder 交叉打包
          - os: macos-15
            label: macOS arm64
            target: mac
          - os: macos-15
            label: macOS x64
            target: mac-x64
            experimental: true
          - os: windows-latest
            label: Windows x64
            target: win
    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      # macOS：用脚本自己组装 .app + dmg（不依赖 electron-builder 的 app-builder 二进制）
      - name: 构建 macOS 安装包（当前架构，脚本组装）
        if: matrix.target == 'mac'
        run: node scripts/pack-mac.js

      - name: 构建 macOS x64 安装包（交叉打包）
        if: matrix.target == 'mac-x64'
        run: npm run build:mac -- --x64 --publish never

      - name: 构建 Windows 安装包
        if: matrix.target == 'win'
        run: npm run build:win -- --publish never

      - name: 列出产物
        shell: bash
        run: ls -lh release/ || true

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.label }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error

  publish:
    name: 发布到 Releases
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: 检查产物
        run: ls -lh artifacts

      # 已有 Release 时只补/覆盖资产，保留人工写的发布说明
      - name: 创建或补全 Release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，追加资产"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber

